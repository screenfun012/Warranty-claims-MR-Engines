# Automatski IMAP sync na produkciju (bez Vercel Cron — Hobby limit).
#
# GitHub → Settings → Secrets and variables → Actions (repository secrets):
#   APP_URL     = https://warranty-claims-mr-engines.vercel.app  (bez / na kraju)
#   CRON_SECRET = isto kao CRON_SECRET na Vercel Production env
#
# Ručni test: Actions → Mail sync → Run workflow (koristi poslednji commit na main)

name: Mail sync

on:
  schedule:
    - cron: "*/15 * * * *" # UTC svakih 15 min; za ređe: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: mail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call production mail-sync API
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing APP_URL or CRON_SECRET in repository Secrets"
            exit 1
          fi
          BASE="$(printf '%s' "$APP_URL" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's:/*$::')"
          HEALTH="${BASE}/api/health"
          SYNC="${BASE}/api/cron/mail-sync"

          echo "BASE=$BASE"
          echo "Checking health: GET $HEALTH"
          H_CODE=$(curl -sS -o /tmp/health.body -w "%{http_code}" --connect-timeout 30 --max-time 30 "$HEALTH" || echo "000")
          echo "Health HTTP $H_CODE"
          cat /tmp/health.body 2>/dev/null || true
          echo ""

          if [ "$H_CODE" != "200" ]; then
            echo "::error::GET /api/health mora biti 200. APP_URL je verovatno pogrešan ili deploy nema najnoviji kod."
            echo "Fix: Vercel → Domains → production URL u GitHub secret APP_URL (bez / na kraju). Commit na main mora uključivati app/api/health."
            exit 1
          fi
          echo "Health OK."

          echo ""
          echo "GET $SYNC"
          # Bez curl -f — uvek ispiši telo i kod (curl -f daje samo exit 22)
          S_CODE=$(curl -sS -o /tmp/sync.body -w "%{http_code}" --connect-timeout 30 --max-time 330 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$SYNC" || echo "000")

          echo "Mail-sync HTTP $S_CODE"
          cat /tmp/sync.body 2>/dev/null || true
          echo ""

          if [ "$S_CODE" = "200" ]; then
            echo "Mail sync OK."
            exit 0
          fi

          echo "::error::Mail sync failed (HTTP $S_CODE)"
          case "$S_CODE" in
            401)
              echo "Hint: CRON_SECRET na GitHubu ≠ CRON_SECRET na Vercelu (Production). Moraju biti identični stringovi."
              ;;
            503)
              echo "Hint: Na Vercelu u Production env dodaj CRON_SECRET, pa Redeploy. Bez toga ruta vraća 503."
              ;;
            404)
              echo "Hint: Pogrešan APP_URL ili stari deploy bez rute. Otvori SYNC URL u browseru posle redeploya."
              ;;
            504)
              echo "Hint: FUNCTION_INVOCATION_TIMEOUT — sync predugačak. Na Vercelu Pro maxDuration za /api/cron/mail-sync je 300s; smanji MAIL_SYNC_MAX_MESSAGES_PER_RUN ili proveri IMAP/WebDAV."
              ;;
            000)
              echo "Hint: Mreža / timeout — proveri da li je sajt dostupan."
              ;;
          esac
          exit 1
